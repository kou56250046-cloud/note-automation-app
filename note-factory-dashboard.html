<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>note-factory — 夜の製図室</title>

<!-- PWA。ホーム画面に置いて、合言葉を保存しておけばオフラインでも開く。
     ENC が HTML に埋まっている自己完結型なので、この1枚が取れれば全機能が動く。
     パスは配信ルート（/note-automation-app/）からの相対で書く。 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#050D16">
<link rel="icon" href="./assets/icons/dash-192.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/dash-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="note-factory">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050D16; --ink:#0A1725; --ink2:#0E1E30;
  --panel:rgba(255,255,255,.038); --panel2:rgba(255,255,255,.065);
  --rule:rgba(255,255,255,.085); --hair:rgba(212,169,74,.22);
  --tx:#E7EEF5; --tx2:#9DB2C6; --tx3:#5F7489;
  --gold:#D4A94A; --gold2:#F0CE84; --goldd:#7C5F1C;
  --azure:#6BA6DE; --azure2:#3E6E9E; --rose:#D4695E;
  --mincho:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',YuMincho,serif;
  --sans:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);font-weight:300;color:var(--tx);font-size:14px;line-height:1.75;
  background:var(--void);-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(107,166,222,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(107,166,222,.045) 1px,transparent 1px),
    linear-gradient(rgba(212,169,74,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,169,74,.05) 1px,transparent 1px);
  background-size:26px 26px,26px 26px,130px 130px,130px 130px;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 65% at 50% -10%,rgba(107,166,222,.13),transparent 62%),
             radial-gradient(ellipse 70% 50% at 88% 8%,rgba(212,169,74,.09),transparent 60%),
             radial-gradient(ellipse 120% 90% at 50% 115%,rgba(5,13,22,.95),transparent 55%);
}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px 90px;position:relative;z-index:1}
::selection{background:rgba(212,169,74,.28)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}

/* ============ lock ============ */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.lockcard{width:100%;max-width:452px;position:relative;padding:46px 40px 34px;
  background:linear-gradient(160deg,rgba(255,255,255,.062),rgba(255,255,255,.022));
  border:1px solid var(--rule);border-radius:5px;
  box-shadow:0 34px 70px -22px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(9px);animation:rise .8s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tick{position:absolute;width:13px;height:13px;border:1px solid var(--hair);opacity:.85}
.tick.tl{top:9px;left:9px;border-right:0;border-bottom:0}
.tick.tr{top:9px;right:9px;border-left:0;border-bottom:0}
.tick.bl{bottom:9px;left:9px;border-right:0;border-top:0}
.tick.br{bottom:9px;right:9px;border-left:0;border-top:0}
.mark{display:flex;justify-content:center;margin-bottom:20px}
.lockcard h1{font-family:var(--mincho);font-weight:600;font-size:27px;letter-spacing:.1em;text-align:center;
  background:linear-gradient(100deg,var(--gold2) 8%,#fff 42%,var(--gold) 78%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lockcard .sub{text-align:center;color:var(--tx3);font-size:11px;letter-spacing:.32em;margin:9px 0 30px;font-family:var(--mono)}
.lockcard .lead{text-align:center;color:var(--tx2);font-size:12.5px;margin-bottom:26px;font-weight:300}
input,textarea{width:100%;font-family:var(--mono);font-weight:300;font-size:13px;color:var(--tx);
  background:rgba(0,0,0,.34);border:1px solid var(--rule);border-radius:3px;padding:13px 14px;outline:none;
  transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--tx3)}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,169,74,.13)}
/* 合言葉を保存するかの選択。上の input 一括指定を打ち消す */
.remember{display:flex;align-items:flex-start;gap:9px;margin:13px 1px 0;text-align:left;
  font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--tx2);cursor:pointer;
  -webkit-user-select:none;user-select:none}
.remember input[type=checkbox]{width:15px;height:15px;flex:none;margin:1px 0 0;padding:0;
  background:transparent;border:0;border-radius:0;accent-color:var(--gold);cursor:pointer}
.remember input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;box-shadow:none}
button{font-family:var(--sans);font-weight:400;font-size:13px;cursor:pointer;border-radius:3px;border:1px solid transparent;
  background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,var(--goldd));color:#12100A;
  padding:12px 20px;letter-spacing:.05em;transition:filter .2s,transform .12s;
  box-shadow:0 6px 18px -8px rgba(212,169,74,.6)}
button:hover{filter:brightness(1.11)} button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;filter:none}
button.ghost{background:transparent;color:var(--tx2);border-color:var(--rule);box-shadow:none}
button.ghost:hover{color:var(--tx);border-color:var(--hair);filter:none}
.err{color:var(--rose);font-size:12px;min-height:20px;margin-top:11px;text-align:center;letter-spacing:.02em}
.hint{margin-top:26px;padding-top:19px;border-top:1px solid var(--rule);font-size:11px;color:var(--tx3);
  line-height:1.8;text-align:center}
.hint code{font-family:var(--mono);color:var(--gold2);background:rgba(212,169,74,.11);
  padding:2px 7px;border-radius:2px;border:1px solid rgba(212,169,74,.2)}

/* ============ header ============ */
header{padding:34px 0 0;margin-bottom:2px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.bl{display:flex;align-items:center;gap:15px}
.brand h1{font-family:var(--mincho);font-weight:600;font-size:27px;letter-spacing:.11em;line-height:1.15;
  background:linear-gradient(100deg,var(--gold2),#fff 46%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .tag{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.3em;margin-top:5px}
.meta{text-align:right;font-family:var(--mono);font-size:11px;color:var(--tx2);line-height:1.9}
.meta .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);
  margin-right:6px;box-shadow:0 0 8px var(--gold);animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);position:relative}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;box-shadow:none;color:var(--tx3);padding:12px 17px;font-size:13px;
  white-space:nowrap;border-radius:0;letter-spacing:.06em;position:relative;font-weight:300}
nav button::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .25s}
nav button:hover{color:var(--tx2);filter:none}
nav button.on{color:var(--gold2);font-weight:400}
nav button.on::after{opacity:1}
nav button .bdg{font-family:var(--mono);font-size:9px;background:rgba(212,169,74,.18);color:var(--gold2);
  padding:1px 5px;border-radius:8px;margin-left:6px;vertical-align:1px}

/* ============ cards ============ */
section{padding-top:30px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(158deg,rgba(255,255,255,.05),rgba(255,255,255,.017));
  border:1px solid var(--rule);border-radius:5px;padding:24px 26px;margin-bottom:20px;
  box-shadow:0 20px 44px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.card>h2{font-family:var(--mincho);font-weight:600;font-size:17px;letter-spacing:.09em;margin-bottom:5px;color:#F2F6FA}
.card>h2 .en{font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.24em;margin-left:11px;font-weight:300}
.card>.desc{font-size:12px;color:var(--tx2);margin-bottom:20px;line-height:1.8;max-width:74ch}
/* 枚数が変わっても割り切れるように auto-fit にする。
   4枚固定にしていた頃は、5枚目が単独で1行に落ちて見た目が崩れた */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));
  gap:14px;margin-bottom:20px}
.kpi{position:relative;overflow:hidden;padding:18px 19px 15px;border-radius:5px;
  background:linear-gradient(158deg,rgba(255,255,255,.058),rgba(255,255,255,.016));
  border:1px solid var(--rule);box-shadow:0 18px 38px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .3s}
.kpi:hover{transform:translateY(-3px);border-color:var(--hair)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.kpi .lb{font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.2em;margin-bottom:9px}
.kpi .vl{font-family:var(--mono);font-weight:300;font-size:31px;letter-spacing:-.025em;line-height:1.05;color:#F4F8FB}
.kpi .vl .yen{font-size:17px;color:var(--gold);margin-right:2px}
.kpi .dt{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:7px;letter-spacing:.03em}
.kpi .dt.up{color:var(--gold2)}
.kpi .spark{position:absolute;right:0;bottom:0;width:78px;height:34px;opacity:.5}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 14px 60px}.card{padding:18px 15px}}

/* ============ charts ============ */
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.ax{font-family:var(--mono);font-size:9.5px;fill:var(--tx3);font-weight:300}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:15px;
  padding-top:13px;border-top:1px solid var(--rule);font-family:var(--mono)}
.legend i{display:inline-block;width:15px;height:2px;vertical-align:middle;margin-right:7px;border-radius:1px}
.tools{display:flex;gap:7px;margin-bottom:17px;flex-wrap:wrap}
.tools button{padding:6px 14px;font-size:11.5px;background:transparent;color:var(--tx3);
  border:1px solid var(--rule);box-shadow:none;font-family:var(--mono);letter-spacing:.06em}
.tools button:hover{color:var(--tx2);filter:none}
.tools button.on{background:rgba(212,169,74,.13);color:var(--gold2);border-color:var(--hair)}
.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.7s cubic-bezier(.22,1,.32,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-origin:bottom;animation:grow .9s cubic-bezier(.22,1,.32,1) backwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ============ table ============ */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:800px}
th{text-align:left;font-family:var(--mono);font-weight:400;font-size:9.5px;color:var(--tx3);letter-spacing:.17em;
  border-bottom:1px solid var(--rule);padding:10px;cursor:pointer;white-space:nowrap;user-select:none;transition:color .2s}
th:hover{color:var(--gold2)}
th.s{color:var(--gold2)}
th.s::after{content:' ▾'} th.s.asc::after{content:' ▴'}
td{border-bottom:1px solid rgba(255,255,255,.045);padding:11px 10px;vertical-align:middle;font-weight:300}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(212,169,74,.045)}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap;font-weight:300}
.ttl{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 8px;border:1px solid var(--rule);border-radius:2px;
  color:var(--tx3);white-space:nowrap;letter-spacing:.05em}
.pill.paid{border-color:var(--hair);color:var(--gold2);background:rgba(212,169,74,.09)}
.bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;position:relative;min-width:46px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--azure2),var(--azure));box-shadow:0 0 9px rgba(107,166,222,.5)}
.bar i.g{background:linear-gradient(90deg,var(--goldd),var(--gold2));box-shadow:0 0 9px rgba(212,169,74,.5)}
.dots{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent}
.dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 7px rgba(212,169,74,.6)}
.dot.off{border-color:rgba(212,105,94,.5);border-style:dashed}

/* ============ alerts / log ============ */
.al{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:flex-start}
.al:last-child{border-bottom:none}
.al b{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;padding:3px 9px;border-radius:2px;
  border:1px solid currentColor;white-space:nowrap;font-weight:400;margin-top:2px}
.al.w b{color:var(--rose);background:rgba(212,105,94,.08)}
.al.i b{color:var(--gold2);background:rgba(212,169,74,.08)}
.al p{font-size:12.5px;line-height:1.8;color:var(--tx2)}
.al p strong{color:var(--tx);font-weight:400}
.al p em{font-style:normal;color:var(--tx3)}
.log{position:relative;padding:0 0 0 26px}
.log::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--hair) 12%,var(--hair) 88%,transparent)}
.lr{position:relative;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.lr:last-child{border-bottom:none}
.lr::before{content:'';position:absolute;left:-25px;top:21px;width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--gold);box-shadow:0 0 9px rgba(212,169,74,.55)}
.lr.warn::before{border-color:var(--rose);box-shadow:0 0 9px rgba(212,105,94,.55)}
.lr .lt{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.lr .lt .ts{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.lr .lt .rn{font-family:var(--mono);font-size:11.5px;color:var(--gold2);letter-spacing:.04em}
.lr .lt .du{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-left:auto}
.lr .lm{font-size:13px;color:var(--tx)}
.lr .ld{font-size:11.5px;color:var(--tx3);margin-top:6px;line-height:1.75;padding-left:11px;
  border-left:1px solid rgba(255,255,255,.08)}
.lr .act{margin-top:10px}
.lr .act button{padding:5px 13px;font-size:11px}

/* ============ flow ============ */
.node{cursor:pointer}
.nb{fill:rgba(255,255,255,.045);stroke:var(--rule);stroke-width:1;transition:all .3s}
.node:hover .nb{fill:rgba(255,255,255,.09);stroke:var(--hair)}
.nb.act{stroke:var(--gold);stroke-width:1.4;fill:rgba(212,169,74,.09);filter:url(#glow)}
.nt{font-family:var(--mincho);font-weight:600;font-size:14px;fill:#EFF4F9}
.ns{font-family:var(--sans);font-size:10.5px;fill:var(--tx3);font-weight:300}
.nm{font-family:var(--mono);font-size:9.5px;fill:var(--gold2)}
.detail{margin-top:18px;padding:18px 20px;border-radius:4px;min-height:96px;
  background:linear-gradient(158deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--rule)}
.detail h3{font-family:var(--mincho);font-weight:600;font-size:15px;margin-bottom:7px;color:#F2F6FA}
.detail .io{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--rule)}
.plist{margin-top:18px}
.prow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.045);font-size:12.5px;align-items:center}
.prow:last-child{border-bottom:none}
.prow .st{font-family:var(--mono);font-size:10.5px;color:var(--gold2);white-space:nowrap;letter-spacing:.04em}

/* ============ form ============ */
.frm{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:end}
label{font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.17em;display:block;margin-bottom:7px}
@media(max-width:760px){.frm{grid-template-columns:repeat(2,1fr)}table{min-width:640px}}
textarea{font-size:11px;line-height:1.7;min-height:150px;resize:vertical}
.note{font-size:11.5px;color:var(--tx3);margin-top:14px;line-height:1.8;padding-left:12px;
  border-left:1px solid var(--hair)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
    <div class="mark">
      <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="19" fill="none" stroke="#D4A94A" stroke-width=".7" opacity=".45"/>
        <circle cx="24" cy="24" r="13" fill="none" stroke="#D4A94A" stroke-width=".7" opacity=".28"/>
        <path d="M24 8 L36 34 L24 28 L12 34 Z" fill="none" stroke="#D4A94A" stroke-width="1.1" stroke-linejoin="round"/>
        <circle cx="24" cy="8" r="2" fill="#D4A94A"/>
      </svg>
    </div>
    <h1>note-factory</h1>
    <div class="sub">NIGHT DRAFTING ROOM</div>
    <div class="lead">執筆と販売の設計図。<br>合言葉を入力してください。</div>
    <label class="sr" for="pw">合言葉</label>
    <input type="password" id="pw" placeholder="passphrase" autocomplete="current-password" spellcheck="false">
    <label class="remember" for="remember">
      <input type="checkbox" id="remember" checked>
      <span>この端末に保存して、次回から自動で開く</span>
    </label>
    <div style="height:14px"></div>
    <button id="go" style="width:100%">開く</button>
    <div class="err" id="err"></div>
    <div class="hint">AES-GCM-256 で暗号化。復号はこのブラウザの中だけで行われます。<br>
      保存すると合言葉がこの端末に残ります。共用の端末では外してください。</div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand">
      <div class="bl">
        <svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="19" fill="none" stroke="#D4A94A" stroke-width=".7" opacity=".4"/>
          <path d="M24 8 L36 34 L24 28 L12 34 Z" fill="none" stroke="#D4A94A" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="24" cy="8" r="2" fill="#D4A94A"/>
        </svg>
        <div>
          <h1>note-factory</h1>
          <div class="tag">NIGHT DRAFTING ROOM</div>
        </div>
      </div>
      <div class="meta" id="hmeta"></div>
    </div>
    <nav id="nav"></nav>
  </header>
  <section id="view"></section>

const ITER = 310000;
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nf = n => n.toLocaleString('ja-JP');
let D = null, TAB = 'home';

async function unlock(pass){
  const raw = b64(ENC), salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},
    km, {name:'AES-GCM',length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct)));
}
/* 合言葉の保存は選択制にしている。
   チェックが入っているときだけ localStorage に残し、次回から自動で開く。
   外したときはその場で消すので、次に開くと手入力に戻る。

   **合言葉が唯一の防御である。** 公開URLは推測できるため、
   共用端末では必ず外すか、開いたあとに「合言葉を消す」を押すこと。
   選択そのもの（nf-remember）は合言葉ではないので、外した場合も記憶しておく。 */
const PASS_KEY = 'nf-pass';
const REMEMBER_KEY = 'nf-remember';
const ls = {
  get: k => { try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set: (k, v) => { try{ localStorage.setItem(k, v); }catch(_){} },
  del: k => { try{ localStorage.removeItem(k); }catch(_){} },
};
const readPass = () => ls.get(PASS_KEY);
const wantsRemember = () => { const c = $('#remember'); return c ? c.checked : true; };

function applyRemember(pw){
  if(wantsRemember()){ ls.set(PASS_KEY, pw); ls.set(REMEMBER_KEY, '1'); }
  else { ls.del(PASS_KEY); ls.set(REMEMBER_KEY, '0'); }
}
function forgetPass(){ ls.del(PASS_KEY); ls.set(REMEMBER_KEY, '0'); location.reload(); }

async function tryUnlock(pw, quiet){
  const e = $('#err');
  if(!quiet){ $('#go').disabled = true; e.textContent = '復号しています…'; }
  try{
    D = await unlock(pw);
    applyRemember(pw);
    $('#lock').style.display = 'none'; $('#app').style.display = 'block'; boot();
    return true;
  }catch(_){
    // 保存済みで失敗したら古い合言葉が残っている。消して入力に戻す
    if(quiet){ ls.del(PASS_KEY); }
    else { e.textContent = '開けませんでした。合言葉を確認してください。'; $('#go').disabled = false; }
    return false;
  }
}

$('#go').onclick = () => {
  const pw = $('#pw').value;
  if(!pw){ $('#err').textContent = '合言葉を入力してください。'; return; }
  tryUnlock(pw, false);
};
$('#pw').addEventListener('keydown', ev => { if(ev.key === 'Enter') $('#go').click(); });

/* 前回の選択を戻してから、保存済みなら自動で開く */
(() => {
  if(ls.get(REMEMBER_KEY) === '0'){ const c = $('#remember'); if(c) c.checked = false; }
  const saved = readPass();
  if(saved) tryUnlock(saved, true);
})();

/* チェックを外した時点で、既に保存されているものを消す。
   「開く」を押し直さないと消えないと、外したのに残っていることになる。 */
$('#remember').addEventListener('change', () => {
  if(!wantsRemember()){ ls.del(PASS_KEY); ls.set(REMEMBER_KEY, '0'); }
  else { ls.set(REMEMBER_KEY, '1'); }
});

/* PWA。ホーム画面に置くと、合言葉を保存してある限りオフラインでも開く。
   file:// で開くと SecurityError になるため、セキュアコンテキストのときだけ登録する。
   isSecureContext は https と localhost / 127.0.0.1 で true、file:// では false になる。 */
if('serviceWorker' in navigator && isSecureContext){
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

const TABS = [['home','ホーム'],['posts','記事'],['ladder','商品ライン'],['flow','フロー'],['log','自動運転ログ'],['input','入力']];
function boot(){
  /* デモデータを実績として引用しないための警告。
     profile-accumulator が架空の数値を拾うと CLAUDE.md ルール3に違反する。 */
  const demoTag = D.isDemo
    ? '<br><span style="color:#e0a030;font-size:11px">デモデータです。実績として引用しないこと</span>'
    : '';
  /* アカウント名は note のプロフィールへ張る。数字を見て気になったら
     すぐ本体を開けるようにしておく。 */
  const acct = '<a href="https://note.com/'+D.account.urlname+'" target="_blank" rel="noopener"'
    + ' style="color:inherit;text-decoration:underline;text-underline-offset:2px">@'+D.account.urlname+'</a>';
  $('#hmeta').innerHTML = '<span class="dot"></span>'+(D.isDemo?'デモ表示':'実測データ')+'<br>'
    + D.updatedAt.slice(0,16).replace('T',' ')+' 更新 ／ '+acct
    + demoTag
    + '<br><a href="#" onclick="forgetPass();return false;"'
    + ' style="color:inherit;opacity:.45;font-size:11px;text-decoration:underline">合言葉を消す</a>';
  $('#nav').innerHTML = TABS.map(([k,l])=>{
    const b = k==='log' ? '<span class="bdg">'+D.autolog.filter(x=>x.st!=='ok').length+'</span>' : '';
    return '<button data-t="'+k+'">'+l+b+'</button>';
  }).join('');
  $('#nav').onclick = ev => { const b = ev.target.closest('button'); if(b){ TAB = b.dataset.t; render(); } };
  render();
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===TAB));
  $('#view').innerHTML = ({home:vHome,posts:vPosts,ladder:vLadder,flow:vFlow,log:vLog,input:vInput})[TAB]();
  if(TAB==='posts') bindTable();
  if(TAB==='flow') bindFlow();
  if(TAB==='input') bindInput();
  if(TAB==='log') bindLog();
  bindCurve(); countUp();
  window.scrollTo(0,0);
}
function card(t,en,d,b){
  return '<div class="card"><h2>'+t+(en?'<span class="en">'+en+'</span>':'')+'</h2>'+
    (d?'<div class="desc">'+d+'</div>':'')+b+'</div>';
}
function countUp(){
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const end = +el.dataset.cu, pre = el.dataset.pre||'', t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = pre + nf(Math.round(end*e)); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function sparkline(vals,color){
  const W=78,H=34,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*W, H-4-((v-mn)/r)*(H-10)]);
  const d = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<polygon points="0,'+H+' '+d+' '+W+','+H+'" fill="'+color+'" opacity=".13"/>'+
    '<polyline points="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.3" opacity=".85"/></svg>';
}

/* ================= ホーム ================= */
function vHome(){
  /* 履歴も売上も、運用の初日は1点も無い。
     デモデータ（履歴271日・売上6ヶ月）を前提に書くと実データで例外が出て
     ホームが真っ白になる。無いことを前提にする。 */
  const fh = D.followerHistory || [], n = fh.length;
  const dF = n >= 2 ? fh[n-1].followers - fh[n-2].followers : null;
  const ms = (D.revenue && D.revenue.months) || [];
  const rv = ms.length ? ms[ms.length-1] : null;
  const grow=D.articles.filter(a=>a.dailyLikes>=0.7).length;
  const fs=fh.slice(-40).map(h=>h.followers);
  const rs=ms.map(m=>m.revenue);
  const ls=D.articles.slice().sort((a,b)=>a.publishedAt<b.publishedAt?-1:1).map(a=>a.likes);
  const cs=D.articles.slice().sort((a,b)=>a.publishedAt<b.publishedAt?-1:1).map(a=>a.comments||0);
  const T=D.totals||{};

  /* ビュー数は note の公開 API に無い（記事詳細120フィールドを調べても存在しない）。
     取れないものを推定で埋めず、取得できないと画面に出す。 */
  const views = (T.views==null) ? null : T.views;

  const k=[
    ['FOLLOWERS',D.account.followerCount,'',
      dF==null ? '前日比はまだ出せない' : (dF>=0?'+':'')+dF+' 前日比', dF!=null&&dF>0, fs,'#6BA6DE'],

function curveChart(mode){

  const maxD=270, maxY=Math.max(60,Math.ceil(Math.max.apply(null,D.articles.map(a=>a.likes))/50)*50);
  const px=d=>L+(d/maxD)*(W-L-R), py=v=>H-B-(v/maxY)*(H-B-T);

    '<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A94A" stop-opacity=".22"/><stop offset="1" stop-color="#D4A94A" stop-opacity="0"/></linearGradient>'+
    '<filter id="gw"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  for(let i=0;i<=4;i++){ const v=maxY*i/4,y=py(v);
    s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'+

  [0,30,60,90,120,150,180,210,240,270].forEach(d=>{
    s+='<text class="ax" x="'+px(d)+'" y="'+(H-B+19)+'" text-anchor="middle">'+d+'</text>'; });
  s+='<text class="ax" x="'+(W-R)+'" y="'+(H-B+34)+'" text-anchor="end" style="letter-spacing:.2em">DAYS SINCE PUBLISH</text>';
  const hot=arts.filter(a=>a.dailyLikes>=0.7), cold=arts.filter(a=>a.dailyLikes<0.7);
  cold.forEach(a=>{ const d=a.curve.map(p=>px(p[0])+','+py(p[1])).join(' ');
    s+='<polyline class="draw" points="'+d+'" fill="none" stroke="#3E6E9E" stroke-width="1.1" opacity=".55" stroke-linejoin="round"/>';
    const lp=a.curve[a.curve.length-1];
    s+='<circle cx="'+px(lp[0])+'" cy="'+py(lp[1])+'" r="1.8" fill="#3E6E9E" opacity=".7"/>'; });
  hot.forEach(a=>{ const d=a.curve.map(p=>px(p[0])+','+py(p[1])).join(' ');
    s+='<polygon points="'+px(0)+','+py(0)+' '+d+' '+px(a.curve[a.curve.length-1][0])+','+py(0)+'" fill="url(#gg)"/>';
    s+='<polyline class="draw" points="'+d+'" fill="none" stroke="#D4A94A" stroke-width="1.9" opacity=".95" stroke-linejoin="round" filter="url(#gw)"/>';
    const lp=a.curve[a.curve.length-1];
    s+='<circle cx="'+px(lp[0])+'" cy="'+py(lp[1])+'" r="3.1" fill="#F0CE84" filter="url(#gw)"/>'; });
  arts.forEach(a=>{ s+='<polyline class="hit" data-k="'+a.key+'" points="'+a.curve.map(p=>px(p[0])+','+py(p[1])).join(' ')+
    '" fill="none" stroke="transparent" stroke-width="14" style="cursor:pointer"/>'; });
  s+='<text id="clab" class="ax" x="'+(L+10)+'" y="'+(T+4)+'" style="font-size:11.5px;fill:#E7EEF5;letter-spacing:.02em"></text></svg>';

function folChart(){

    '<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6BA6DE" stop-opacity=".3"/><stop offset="1" stop-color="#6BA6DE" stop-opacity="0"/></linearGradient></defs>';
  for(let i=0;i<=3;i++){ const v=mn+(mx-mn)*i/3,y=py(v);

       '<text class="ax" x="'+(L-11)+'" y="'+(y+3.5)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  D.articles.forEach(a=>{ const i=fh.findIndex(h=>h.date===a.publishedAt); if(i<0) return;
    s+='<line x1="'+px(i)+'" y1="'+T+'" x2="'+px(i)+'" y2="'+(H-B)+'" stroke="#D4A94A" stroke-width="1" stroke-dasharray="2 4" opacity="'+(a.isPaid?.55:.22)+'"/>';

  const pts=fh.map((h,i)=>px(i)+','+py(h.followers)).join(' ');
  s+='<polygon points="'+px(0)+','+(H-B)+' '+pts+' '+px(n-1)+','+(H-B)+'" fill="url(#fg)"/>';
  s+='<polyline class="draw" points="'+pts+'" fill="none" stroke="#6BA6DE" stroke-width="1.8"/>';

function calChart(){

  s+='<defs><filter id="gw2"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';

function donut(f,p,tot){
  const R=64,C=2*Math.PI*R,fa=(f/tot)*C;
  return '<div style="display:flex;gap:34px;align-items:center;flex-wrap:wrap">'+
    '<svg viewBox="0 0 170 170" style="width:170px;flex:none"><g transform="translate(85,85) rotate(-90)">'+
    '<circle r="'+R+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="17"/>'+
    '<circle r="'+R+'" fill="none" stroke="#6BA6DE" stroke-width="17" stroke-dasharray="'+fa+' '+C+'" stroke-linecap="butt" opacity=".8"/>'+
    '<circle r="'+R+'" fill="none" stroke="#D4A94A" stroke-width="17" stroke-dasharray="'+(C-fa)+' '+C+'" stroke-dashoffset="'+(-fa)+'" stroke-linecap="butt"/>'+
    '</g><text x="85" y="80" text-anchor="middle" style="font-family:var(--mono);font-size:26px;fill:#F4F8FB">'+tot+'</text>'+
    '<text x="85" y="98" text-anchor="middle" class="ax" style="letter-spacing:.22em">ARTICLES</text></svg>'+
    '<div style="flex:1;min-width:180px">'+
    '<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rule)">'+
    '<span style="color:var(--tx2)"><i style="display:inline-block;width:9px;height:9px;background:#6BA6DE;border-radius:2px;margin-right:9px"></i>無料</span>'+
    '<span style="font-family:var(--mono)">'+f+' 本　'+(f/tot*100).toFixed(0)+'%</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:11px 0">'+
    '<span style="color:var(--tx2)"><i style="display:inline-block;width:9px;height:9px;background:#D4A94A;border-radius:2px;margin-right:9px"></i>有料</span>'+
    '<span style="font-family:var(--mono)">'+p+' 本　'+(p/tot*100).toFixed(0)+'%</span></div></div></div>';
}
function ladderNotes(tiers){
  const o=[],em=tiers.filter(t=>t.arts.length===0);
  if(em.length) o.push(['w','空白',em.map(t=>t.l).join(' と ')+' の段に商品が無い。<em>階段は連続していないと登れない。最上段が空なら、低単価noteをいくら量産しても収入に天井ができる。</em>']);
  const top=tiers[tiers.length-2];
  if(top.arts.length) o.push(['i','最上段','現在の最高単価は ¥4,980 が'+top.arts.length+'本。<em>この上に乗る商品を product-architecture で設計する。</em>']);
  o.push(['i','入口','無料記事が'+D.totals.freeCount+'本。<em>そのうち有料への導線が張れているのは'+D.articles.filter(a=>!a.isPaid&&a.systemization.crossLinked).length+'本。</em>']);
  return o.map(([k,t,p])=>'<div class="al '+k+'"><b>'+t+'</b><p>'+p+'</p></div>').join('');
}

/* 周期ごとの割り当て。CLAUDE.md は部署ではなく「周期」で分けている。

const GRP={

  '着手':1,'初稿':1,'完成':2,
  // 工程名で入ってきた場合も拾えるようにしておく
  'note_market':0,'weekly-research':0,'account-design':0,'account-research':0,'pricing-strategy':0,
  'daily-article':1,'product-concept':1,'sales-letter':1,'draft-writing':1,'title-design':1,
  'lint':2,'dedup':2,'ethics-line':2,'letter-audit':2,'reader-feedback':2,
  'thumbnail-prompt':2,'build-report':2};
function vFlow(){
  const c=[0,0,0]; D.pipeline.forEach(p=>{const g=GRP[p.stage]; if(g!==undefined) c[g]++;});
  return card('二層モデル','BY CYCLE, NOT BY ROLE',
      '部署ではなく<strong>周期</strong>で分ける。リサーチを日次でやるとトークンが尽きるからである。'
      + '日次の生成は web 検索をせず、在庫（themes.md）から1本引くだけにする。これが毎日投稿を成立させている唯一の理由。',
      deptSvg(c)+pipeList())
    + card('無料記事の依存チェーン','DEPENDENCY',
      '前の工程の出力が次の入力になる。飛ばすと入力が欠けるので、スキル側で停止する。各段をクリックすると判断基準が出る。'
      + '<br>有料noteは product-concept → pricing-strategy → sales-letter → draft-writing → letter-audit（2周）→ ethics-line → title-design と進む。',
      chainSvg()+'<div class="detail" id="dt"><h3>段をクリックしてください</h3><div style="font-size:12px;color:var(--tx2)">各工程が何を判断基準にしているかを表示します。</div></div>');
}

    s+='<text class="nt" x="'+(x+w/2)+'" y="'+(y+31)+'" text-anchor="middle">'+t+'</text>';

    s+='<text class="ax" x="'+(x+w/2)+'" y="'+(y+69)+'" text-anchor="middle">'+q+'</text>';

    s+='<path d="M'+(x+w/2)+' '+(y+h+6)+' L'+(x+w/2)+' 178" stroke="#5F7489" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#ar)" opacity=".6"/>'; });
  s+='<rect class="nb" x="40" y="182" width="840" height="70" rx="4"/>';
  s+='<text class="nt" x="460" y="211" text-anchor="middle">knowledge ／ research ／ data</text>';
  s+='<text class="ns" x="460" y="232" text-anchor="middle">account・profile・voice・themes・market が次の入力になる</text>';
  s+='<path d="M460 254 L460 300" stroke="#5F7489" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#ar)" opacity=".6"/>';
  s+='<rect class="nb act" x="330" y="304" width="260" height="70" rx="4"/>';

  s+='<text class="ax" x="460" y="420" text-anchor="middle">金色の枠 ＝ いま記事がある層</text>';
  return s+'</svg>';
}
function pipeList(){
  return '<div class="plist">'+D.pipeline.map(p=>{
    const g=['リサーチ層','生成層','ゲートと配信'][GRP[p.stage]]||'—';
    return '<div class="prow"><span>'+p.title+'</span><span class="st">'+g+' ／ '+p.stage+
      ' <span style="color:var(--tx3)">'+p.updatedAt.slice(5)+'</span></span></div>'; }).join('')+'</div>';
}
function chainSvg(){

function bindFlow(){
  document.querySelectorAll('#view .node[data-i]').forEach(g=>{
    g.onclick=()=>{ const [id,jp,sub,inp,out,body]=UP[+g.dataset.i];
      document.querySelectorAll('#view .node .nb').forEach(r=>r.classList.remove('act'));
      g.querySelector('.nb').classList.add('act');

        '<div style="font-size:12.5px;line-height:1.85;color:var(--tx2)">'+body+'</div>'+

}

  document.querySelectorAll('.lr .act button').forEach(b=>{

function vInput(){
  return card('月次売上の入力','MANUAL ENTRY',
      '売上は自動取得しない。Cookie とブラウザ操作を必要とする自動化はシステム全体を壊れやすくするため、月1回の手入力に寄せている。revenue-maximizer の診断に必要な粒度は月次で足りる。',
      '<div class="frm">'+
      '<div><label>MONTH</label><input type="text" id="i-m" placeholder="2026-08" value="2026-08"></div>'+
      '<div><label>REVENUE</label><input type="number" id="i-r" placeholder="231000"></div>'+
      '<div><label>PURCHASES</label><input type="number" id="i-p" placeholder="44"></div>'+
      '<div><button id="i-add" style="width:100%">追加する</button></div></div>'+
      '<div style="margin-top:14px"><label>MEMO</label><input type="text" id="i-n" placeholder="追記告知あり ／ 値上げ実施 など"></div>'+
      '<div class="note">GitHub Pages は静的配信のため、ブラウザから直接ファイルは書けない。下の JSON をコピーして Claude Code に渡すと、'+
      '<span style="font-family:var(--mono);color:var(--gold2)">data/revenue.json</span> に反映されて次回のビルドに乗る。</div>')
    + card('月次推移','MONTHLY','',revChart())
    + card('revenue.json','EXPORT','','<textarea id="i-out" spellcheck="false"></textarea>'+
      '<div style="margin-top:12px;display:flex;gap:9px"><button id="i-copy">コピー</button>'+
      '<button class="ghost" id="i-reset">入力を取り消す</button></div>');
}
function revChart(){
  const ms=D.revenue.months,W=920,H=250,L=70,R=18,T=18,B=52;
  const mx=Math.ceil(Math.max.apply(null,ms.map(m=>m.revenue))/100000)*100000;
  const bw=(W-L-R)/ms.length*0.5;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img"><title>月次売上</title><defs>'+
    '<linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0CE84"/><stop offset="1" stop-color="#7C5F1C" stop-opacity=".55"/></linearGradient>'+
    '<filter id="gw3"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  for(let i=0;i<=4;i++){ const v=mx*i/4,y=H-B-(v/mx)*(H-B-T);
    s+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'+
       '<text class="ax" x="'+(L-11)+'" y="'+(y+3.5)+'" text-anchor="end">'+(v/10000)+'万</text>'; }
  ms.forEach((m,i)=>{
    const cx=L+((W-L-R)/ms.length)*(i+0.5),h=(m.revenue/mx)*(H-B-T),y=H-B-h;
    s+='<rect class="grow" style="animation-delay:'+(i*.07)+'s" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+
      '" rx="2" fill="url(#rb)" filter="url(#gw3)"><title>'+m.month+' ¥'+nf(m.revenue)+'</title></rect>';
    s+='<text class="ax" x="'+cx+'" y="'+(H-B+19)+'" text-anchor="middle" style="fill:#9DB2C6">'+m.month.slice(5)+'月</text>';
    s+='<text class="ax" x="'+cx+'" y="'+(H-B+34)+'" text-anchor="middle" style="font-size:9px">'+m.note+'</text>'; });
  return s+'</svg>';
}
let ADDED=[];
function bindInput(){
  const out=()=>{document.getElementById('i-out').value=JSON.stringify({months:D.revenue.months.concat(ADDED)},null,2);};
  document.getElementById('i-add').onclick=()=>{
    const m=document.getElementById('i-m').value.trim(),r=+document.getElementById('i-r').value,p=+document.getElementById('i-p').value;
    if(!/^\d{4}-\d{2}$/.test(m)||!r){ alert('月は YYYY-MM 形式で、売上は必須です。'); return; }
    ADDED.push({month:m,revenue:r,purchases:p||0,note:document.getElementById('i-n').value.trim()}); out(); };
  document.getElementById('i-copy').onclick=()=>{
    const t=document.getElementById('i-out'); t.select();
    navigator.clipboard.writeText(t.value).then(()=>{
      const b=document.getElementById('i-copy'); b.textContent='コピーしました'; setTimeout(()=>b.textContent='コピー',1600); }).catch(()=>{}); };
  document.getElementById('i-reset').onclick=()=>{ADDED=[];out();};
  out();
}
