<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>after — 余白・階層・色数を直した管理画面</title>
<style>
  /* ==================================================================
     色は「机の上の紙とインク」から決めている。
     紙の生成り地に、インクの濃紺。アクセントは藍の一色だけ。
     ================================================================== */
  :root {
    --paper:  #f6f3ec;
    --surface:#ffffff;
    --line:   #e6e0d0;
    --ink:    #221f19;
    --ink-2:  #85796a;
    --accent: #2456e0;   /* 最重要指標だけに使う藍 */
    --accent-soft: rgba(36,86,224,.08);
    --ok:   #4f7a5c;
    --warn: #a67c2e;
    --bad:  #a24a42;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    min-height: 100vh;
  }

  /* ---------- サイドバー: 装飾を消し、選択中だけ強調する ---------- */

  .sidebar {
    width: 200px;
    padding: 32px 20px;
    border-right: 1px solid var(--line);
  }

  .sidebar .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--ink-2);
    margin-bottom: 32px;
  }

  .sidebar nav a {
    display: block;
    color: var(--ink-2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 10px;
    margin-bottom: 2px;
    border-radius: 6px;
    border-left: 2px solid transparent;
  }

  .sidebar nav a.active {
    color: var(--ink);
    font-weight: 700;
    background: var(--accent-soft);
    border-left: 2px solid var(--accent);
  }

  /* ---------- メイン ---------- */

  .main {
    flex: 1;
    padding: 40px 48px;
    max-width: 1040px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  header .date {
    font-size: 12px;
    color: var(--ink-2);
  }

  /* ---------- KPI: 1つだけ主役にする ---------- */

  .kpis {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
  }

  .kpi-hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 24px;
  }

  .kpi-hero .label {
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 10px;
  }

  .kpi-hero .value {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .kpi-hero .delta {
    font-size: 13px;
    color: var(--ok);
    font-weight: 600;
  }

  /* 7日ぶんの棒グラフ。画像もライブラリも使わない */
  .spark {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 56px;
  }
  .spark span {
    width: 10px;
    border-radius: 2px 2px 0 0;
    background: var(--accent);
  }

  .kpi-sub-list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .kpi-sub {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .kpi-sub .label {
    font-size: 12px;
    color: var(--ink-2);
  }

  .kpi-sub .value {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }

  .kpi-sub .delta {
    font-size: 11px;
    margin-left: 8px;
    color: var(--ink-2);
  }

  /* ---------- テーブル ---------- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 28px;
  }

  .panel h2 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 18px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--line);
  }

  td {
    text-align: left;
    padding: 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }

  tr:last-child td { border-bottom: none; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .status.done    { color: var(--ok); }
  .status.done::before    { background: var(--ok); }
  .status.pending { color: var(--warn); }
  .status.pending::before { background: var(--warn); }
  .status.cancel  { color: var(--bad); }
  .status.cancel::before  { background: var(--bad); }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">管理画面</div>
    <nav>
      <a href="#" class="active">ダッシュボード</a>
      <a href="#">注文</a>
      <a href="#">顧客</a>
      <a href="#">在庫</a>
      <a href="#">設定</a>
    </nav>
  </aside>

  <main class="main">
    <header>
      <h1>ダッシュボード</h1>
      <div class="date">2026年8月</div>
    </header>

    <section class="kpis">
      <div class="kpi-hero">
        <div>
          <div class="label">今月の売上</div>
          <div class="value">¥4,820,000</div>
          <div class="delta">前月比 +12.4%</div>
        </div>
        <div class="spark" aria-label="直近7日の売上推移。右にいくほど高い">
          <span style="height:34%"></span>
          <span style="height:48%"></span>
          <span style="height:40%"></span>
          <span style="height:60%"></span>
          <span style="height:52%"></span>
          <span style="height:78%"></span>
          <span style="height:100%"></span>
        </div>
      </div>

      <div class="kpi-sub-list">
        <div class="kpi-sub">
          <span class="label">新規顧客</span>
          <span><span class="value">312人</span><span class="delta">+4.1%</span></span>
        </div>
        <div class="kpi-sub">
          <span class="label">注文数</span>
          <span><span class="value">1,204件</span><span class="delta">+8.9%</span></span>
        </div>
        <div class="kpi-sub">
          <span class="label">返品率</span>
          <span><span class="value">2.3%</span><span class="delta">-0.4%</span></span>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>最近の注文</h2>
      <table>
        <thead>
          <tr>
            <th>注文ID</th>
            <th>顧客名</th>
            <th>金額</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#10231</td>
            <td>山田 太郎</td>
            <td>¥12,800</td>
            <td><span class="status done">完了</span></td>
          </tr>
          <tr>
            <td>#10230</td>
            <td>佐藤 花子</td>
            <td>¥8,400</td>
            <td><span class="status pending">処理中</span></td>
          </tr>
          <tr>
            <td>#10229</td>
            <td>鈴木 一郎</td>
            <td>¥21,000</td>
            <td><span class="status cancel">キャンセル</span></td>
          </tr>
          <tr>
            <td>#10228</td>
            <td>田中 実</td>
            <td>¥5,600</td>
            <td><span class="status done">完了</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
