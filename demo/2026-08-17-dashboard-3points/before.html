<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>before — AIが出したままのダッシュボード</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background:#eef1f6;
    color:#222;
    padding:24px;
  }
  .dashboard { width: 960px; margin:0 auto; }

  header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  header h1 { font-size:18px; font-weight:700; }
  header .date { font-size:14px; color:#555; }

  .grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "trend    category"
      "spacer   summary";
    gap:20px;
  }

  .card {
    background:#fff;
    border-radius:8px;
    padding:20px;
  }
  .card h2 { font-size:15px; font-weight:700; margin-bottom:16px; }

  .card.trend    { grid-area: trend; }
  .card.category { grid-area: category; }

  /* 最重要の数値カードが、右下の小さい枠に押し込まれている */
  .card.summary {
    grid-area: summary;
    justify-self: end;
    align-self: end;
    width: 220px;
    text-align: right;
  }
  .summary .label { font-size:12px; color:#777; margin-bottom:6px; }
  .summary .value { font-size:20px; font-weight:700; }
  .summary .delta { font-size:12px; color:#11998e; margin-top:4px; }

  svg text { font-family: inherit; }
</style>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>売上ダッシュボード</h1>
      <div class="date">2026年8月</div>
    </header>

    <div class="grid">

      <section class="card trend">
        <h2>月次推移</h2>
        <!-- 目盛りが90から始まっている。差が実際より誇張される -->
        <svg viewBox="0 0 460 260" width="100%" style="height:auto; display:block;">
          <line x1="55" y1="220" x2="420" y2="220" stroke="#ccc"/>
          <line x1="55" y1="153.3" x2="420" y2="153.3" stroke="#eee"/>
          <line x1="55" y1="86.7" x2="420" y2="86.7" stroke="#eee"/>
          <line x1="55" y1="20" x2="420" y2="20" stroke="#eee"/>
          <text x="48" y="223" font-size="11" fill="#999" text-anchor="end">90</text>
          <text x="48" y="156" font-size="11" fill="#999" text-anchor="end">110</text>
          <text x="48" y="90"  font-size="11" fill="#999" text-anchor="end">130</text>
          <text x="48" y="24"  font-size="11" fill="#999" text-anchor="end">150</text>

          <!-- 系列は1つ(月次推移)なのに、棒ごとに違う色を使っている -->
          <rect x="60"  y="186.7" width="40" height="33.3"  fill="#ff5f6d"/>
          <rect x="120" y="160"   width="40" height="60"    fill="#38ef7d"/>
          <rect x="180" y="133.3" width="40" height="86.7"  fill="#4a6cf7"/>
          <rect x="240" y="113.3" width="40" height="106.7" fill="#ffd200"/>
          <rect x="300" y="80"    width="40" height="140"   fill="#8e2de2"/>
          <rect x="360" y="36.7"  width="40" height="183.3" fill="#11998e"/>

          <text x="80"  y="235" font-size="11" fill="#666" text-anchor="middle">1月</text>
          <text x="140" y="235" font-size="11" fill="#666" text-anchor="middle">2月</text>
          <text x="200" y="235" font-size="11" fill="#666" text-anchor="middle">3月</text>
          <text x="260" y="235" font-size="11" fill="#666" text-anchor="middle">4月</text>
          <text x="320" y="235" font-size="11" fill="#666" text-anchor="middle">5月</text>
          <text x="380" y="235" font-size="11" fill="#666" text-anchor="middle">6月</text>
        </svg>
      </section>

      <section class="card category">
        <h2>カテゴリ別売上</h2>
        <svg viewBox="0 0 380 190" width="100%" style="height:auto; display:block;">
          <line x1="45" y1="150" x2="360" y2="150" stroke="#ccc"/>

          <!-- 4カテゴリに意味のない4色を個別に割り当てている -->
          <rect x="70"  y="35.2" width="50" height="114.8" fill="#ff5f6d"/>
          <rect x="144" y="59"   width="50" height="91"    fill="#38ef7d"/>
          <rect x="218" y="18.4" width="50" height="131.6" fill="#8e2de2"/>
          <rect x="292" y="82.8" width="50" height="67.2"  fill="#f7971e"/>

          <text x="95"  y="165" font-size="11" fill="#666" text-anchor="middle">家電</text>
          <text x="169" y="165" font-size="11" fill="#666" text-anchor="middle">衣料</text>
          <text x="243" y="165" font-size="11" fill="#666" text-anchor="middle">食品</text>
          <text x="317" y="165" font-size="11" fill="#666" text-anchor="middle">雑貨</text>
        </svg>
      </section>

      <section class="card summary">
        <div class="label">今月の売上</div>
        <div class="value">¥1,450,000</div>
        <div class="delta">前月比 +9.8%</div>
      </section>

    </div>
  </div>
</body>
</html>
