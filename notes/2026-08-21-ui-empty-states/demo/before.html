<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>before — データがそろった状態しかない一覧画面</title>
<style>
  :root {
    --paper:   #f6f3ec;
    --surface: #ffffff;
    --line:    #e6e0d0;
    --ink:     #221f19;
    --ink-2:   #85796a;
    --accent:  #2456e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 40px 48px;
  }
  .app { max-width: 920px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  header p  { font-size: 13px; color: var(--ink-2); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 28px;
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--line);
  }
  td {
    text-align: left;
    padding: 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  tr:last-child td { border-bottom: none; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>問い合わせ一覧</h1>
      <p>2026年8月</p>
    </header>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>件名</th>
            <th>送信者</th>
            <th>受信日時</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#1042</td>
            <td>料金プランについて</td>
            <td>山田 太郎</td>
            <td>08/21 09:12</td>
            <td><span class="status">未対応</span></td>
          </tr>
          <tr>
            <td>#1041</td>
            <td>ログインできない</td>
            <td>佐藤 花子</td>
            <td>08/21 08:47</td>
            <td><span class="status">未対応</span></td>
          </tr>
          <tr>
            <td>#1040</td>
            <td>解約の手続きについて</td>
            <td>鈴木 一郎</td>
            <td>08/20 22:03</td>
            <td><span class="status">対応中</span></td>
          </tr>
          <tr>
            <td>#1039</td>
            <td>請求書の再発行</td>
            <td>田中 実</td>
            <td>08/20 18:31</td>
            <td><span class="status">完了</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
