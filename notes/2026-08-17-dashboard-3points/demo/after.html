<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>after — 色数・目盛り・並びを直したダッシュボード</title>
<style>
  :root {
    --paper:  #f6f3ec;
    --surface:#ffffff;
    --line:   #e6e0d0;
    --ink:    #221f19;
    --ink-2:  #85796a;
    --accent: #2456e0;
    --ok:     #4f7a5c;
  }

  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding:24px;
  }
  .dashboard { width: 960px; margin:0 auto; }

  header {
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:24px;
  }
  header h1 { font-size:18px; font-weight:700; }
  header .date { font-size:13px; color:var(--ink-2); }

  .grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "summary  summary"
      "trend    category";
    gap:20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 28px;
  }
  .card h2 { font-size:14px; font-weight:700; margin-bottom:16px; color:var(--ink); }

  .card.trend    { grid-area: trend; }
  .card.category { grid-area: category; }

  /* 最重要の数値カードを、最上段・左端に大きく置く */
  .card.summary { grid-area: summary; }
  .summary .label { font-size:13px; color:var(--ink-2); margin-bottom:8px; }
  .summary .value { font-size:34px; font-weight:700; color:var(--accent); letter-spacing:-.02em; }
  .summary .delta { font-size:13px; color:var(--ok); margin-top:6px; font-weight:600; }

  svg text { font-family: inherit; }
</style>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>売上ダッシュボード</h1>
      <div class="date">2026年8月</div>
    </header>

    <div class="grid">

      <section class="card summary">
        <div class="label">今月の売上</div>
        <div class="value">¥1,450,000</div>
        <div class="delta">前月比 +9.8%</div>
      </section>

      <section class="card trend">
        <h2>月次推移</h2>
        <!-- 目盛りは0から始める。実際の比率がそのまま伝わる -->
        <svg viewBox="0 0 460 260" width="100%" style="height:auto; display:block;">
          <line x1="55" y1="220" x2="420" y2="220" stroke="#e6e0d0"/>
          <line x1="55" y1="153.3" x2="420" y2="153.3" stroke="#e6e0d0"/>
          <line x1="55" y1="86.7" x2="420" y2="86.7" stroke="#e6e0d0"/>
          <line x1="55" y1="20" x2="420" y2="20" stroke="#e6e0d0"/>
          <text x="48" y="223" font-size="11" fill="#85796a" text-anchor="end">0</text>
          <text x="48" y="156" font-size="11" fill="#85796a" text-anchor="end">50</text>
          <text x="48" y="90"  font-size="11" fill="#85796a" text-anchor="end">100</text>
          <text x="48" y="24"  font-size="11" fill="#85796a" text-anchor="end">150</text>

          <!-- 基本は1色。直近の月だけアクセント色で強調する -->
          <rect x="60"  y="86.7" width="40" height="133.3" fill="#85796a"/>
          <rect x="120" y="76"   width="40" height="144"   fill="#85796a"/>
          <rect x="180" y="65.3" width="40" height="154.7" fill="#85796a"/>
          <rect x="240" y="57.3" width="40" height="162.7" fill="#85796a"/>
          <rect x="300" y="44"   width="40" height="176"   fill="#85796a"/>
          <rect x="360" y="26.7" width="40" height="193.3" fill="#2456e0"/>

          <text x="80"  y="235" font-size="11" fill="#85796a" text-anchor="middle">1月</text>
          <text x="140" y="235" font-size="11" fill="#85796a" text-anchor="middle">2月</text>
          <text x="200" y="235" font-size="11" fill="#85796a" text-anchor="middle">3月</text>
          <text x="260" y="235" font-size="11" fill="#85796a" text-anchor="middle">4月</text>
          <text x="320" y="235" font-size="11" fill="#85796a" text-anchor="middle">5月</text>
          <text x="380" y="235" font-size="11" fill="#2456e0" text-anchor="middle">6月</text>
        </svg>
      </section>

      <section class="card category">
        <h2>カテゴリ別売上</h2>
        <svg viewBox="0 0 380 190" width="100%" style="height:auto; display:block;">
          <line x1="45" y1="150" x2="360" y2="150" stroke="#e6e0d0"/>

          <!-- 基本は1色。最大値のカテゴリだけアクセント色で強調する -->
          <rect x="70"  y="35.2" width="50" height="114.8" fill="#85796a"/>
          <rect x="144" y="59"   width="50" height="91"    fill="#85796a"/>
          <rect x="218" y="18.4" width="50" height="131.6" fill="#2456e0"/>
          <rect x="292" y="82.8" width="50" height="67.2"  fill="#85796a"/>

          <text x="95"  y="165" font-size="11" fill="#85796a" text-anchor="middle">家電</text>
          <text x="169" y="165" font-size="11" fill="#85796a" text-anchor="middle">衣料</text>
          <text x="243" y="165" font-size="11" fill="#2456e0" text-anchor="middle">食品</text>
          <text x="317" y="165" font-size="11" fill="#85796a" text-anchor="middle">雑貨</text>
        </svg>
      </section>

    </div>
  </div>
</body>
</html>
