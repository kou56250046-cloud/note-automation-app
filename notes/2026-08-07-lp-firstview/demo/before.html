<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>before — AIが出したままのファーストビュー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .hero {
    text-align: center;
    color: #fff;
    max-width: 800px;
  }

  .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 14px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 20px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
  }

  .lead {
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 20px;
    opacity: 0.95;
  }

  .points {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .point {
    background: rgba(255, 255, 255, 0.15);
    padding: 20px;
    border-radius: 12px;
    font-size: 15px;
  }

  .cta {
    display: inline-block;
    background: linear-gradient(90deg, #f6d365 0%, #fda085 100%);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 60px;
    border-radius: 100px;
    border: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    margin-bottom: 20px;
  }

  .note {
    font-size: 14px;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="hero">
    <span class="badge">🚀 業務効率化ツール</span>

    <h1>AIで、あなたのビジネスを<br>次のステージへ</h1>

    <p class="lead">
      最先端のAI技術を活用して、日々の業務を劇的に効率化。<br>
      もう単純作業に time を奪われることはありません。
    </p>

    <div class="points">
      <div class="point">✨ かんたん導入</div>
      <div class="point">⚡ 高速処理</div>
      <div class="point">🔒 安心のセキュリティ</div>
    </div>

    <button class="cta">今すぐ無料で始める</button>

    <p class="note">クレジットカード不要 / いつでも解約OK</p>
  </div>
</body>
</html>
