name: deploy-pages

# ダッシュボードと投稿キューを GitHub Pages に配信する。
#
# 配信するもの:
#   /            ダッシュボード（data/ は暗号化済み）
#   /posts/      投稿キュー。スマホからコピペするための画面
#
# 有料noteの本文は AES-GCM-256 で暗号化されている。
# 03-draft.md は .gitignore 対象で Actions 上に存在しないため、
# 暗号化はローカルの build-preview.mjs --public が行い、
# 生成物（preview/public/）をコミットして持ち込む。
#
# このワークフローは暗号化しない。既に暗号化されたものを配るだけである。

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'preview/public/**'
      - 'demo/**'
      - 'notes/**/demo/**'
      - 'note-factory-dashboard.html'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # デモの組み立てに使う。build-demo.mjs は依存なしで動く
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配信物を組み立てる
        run: |
          mkdir -p _site

          # ダッシュボード
          cp note-factory-dashboard.html _site/index.html

          # data/ は配信しない。
          #
          # ダッシュボードは note-factory-dashboard.html の ENC に
          # 暗号化データを埋め込む自己完結型で、data/ を fetch しない。
          # 一方 data/history.jsonl にはフォロワー数が平文で入る。
          # 配信する理由がないものを公開範囲に置かない。
          #
          # 将来ダッシュボードが fetch する設計に戻すなら、
          # 暗号化済みのファイルだけを名指しでコピーすること。

          # 投稿キュー（ローカルで暗号化済み）
          if [ -d preview/public ]; then
            mkdir -p _site/posts
            cp -r preview/public/* _site/posts/ 2>/dev/null || true
          fi

          # PWA。ダッシュボードと投稿キューを別々のアプリとしてホーム画面に置ける。
          #
          # manifest は2つに分ける。start_url が違えば別アプリとして扱われるため、
          # 「note-factory」と「投稿キュー」が並んで入る。
          # Service Worker は1つで足りる。配信ルートに置くと scope が
          # /note-automation-app/ になり、両方を受け持てる。
          mkdir -p _site/assets
          cp -r assets/icons _site/assets/
          cp assets/manifest-dash.webmanifest _site/manifest.webmanifest
          cp assets/sw.js _site/sw.js
          if [ -d _site/posts ]; then
            cp assets/manifest-posts.webmanifest _site/posts/manifest.webmanifest
          fi

          # キャッシュ名にコミットを埋める。
          # 変わるたびに activate で古いキャッシュを捨てるので、
          # push した内容が次の起動で必ず反映される。
          sed -i "s/__BUILD__/${GITHUB_SHA:0:7}/" _site/sw.js
          echo "sw.js のビルド識別子: ${GITHUB_SHA:0:7}"

          # before/after のライブデモ。
          # 記事から読者がリンクを踏む先。暗号化しないので Actions で組み直してよい。
          if [ -d notes ]; then
            node scripts/build-demo.mjs || true
          fi
          if [ -d demo ]; then
            mkdir -p _site/demo
            cp -r demo/* _site/demo/ 2>/dev/null || true
          fi

          # 検索エンジンに拾わせない。
          # note の記事より先にインデックスされると重複コンテンツ扱いになる。
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: 合言葉のヒントを除去する
        run: |
          # 行ごと消すと <div class="hint"> の開始タグまで落ちて HTML が壊れる。
          # 合言葉の記述だけを置換する。
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          before = len(s)
          s = re.sub(r"デモ用の合言葉.*?<br>\s*", "", s, flags=re.S)
          p.write_text(s, encoding="utf-8")
          print(f"{before - len(s)} 文字を除去しました")
          PY

      # 公開してよいものだけが残っているかを配信直前に検査する。
      # ここで落ちたら公開しない。
      - name: 配信物を検査する
        run: |
          fail=0

          # 1. 記事のソース（Markdown）が紛れていないか
          if find _site -name '*.md' | grep -q .; then
            echo "::error::Markdown が配信物に含まれています"
            find _site -name '*.md'
            fail=1
          fi

          # 2. 合言葉の記述が残っていないか
          if grep -rniE "note-factory-blueprint|passphrase\.txt|デモ用の合言葉" _site/ >/dev/null 2>&1; then
            echo "::error::合言葉に関する記述が残っています"
            grep -rniE "note-factory-blueprint|passphrase\.txt|デモ用の合言葉" _site/ || true
            fail=1
          fi

          # 3. 有料部分が平文で入っていないか
          #    公開版は必ず lockbox 形式になる。paywall（平文の区切り）が
          #    出てくるのはローカル版をコピーしてしまったときだけ。
          if grep -rl 'class="paywall"' _site/posts/ >/dev/null 2>&1; then
            echo "::error::有料部分が平文の可能性があります（paywall を検出）"
            grep -rl 'class="paywall"' _site/posts/ || true
            fail=1
          fi

          # 4. 有料記事に暗号文が入っているか
          if [ -d _site/posts ]; then
            for f in _site/posts/*.html; do
              [ -f "$f" ] || continue
              if grep -q '有料エリア' "$f" && ! grep -q 'data-enc=' "$f"; then
                echo "::error::$f に有料エリアがあるのに暗号文がありません"
                fail=1
              fi
            done
          fi

          # 5. noindex が付いているか
          #    デモは note の記事とは別物なので重複コンテンツにはならないが、
          #    robots.txt が全体 Disallow なのに合わせて揃えておく。
          #    ただし before.html / after.html は記事の作例そのもので、
          #    こちらが書いた枠ではないため対象から外す。
          for f in _site/posts/*.html _site/demo/index.html _site/demo/*/index.html; do
            [ -f "$f" ] || continue
            grep -q 'name="robots"' "$f" || { echo "::error::$f に noindex がありません"; fail=1; }
          done

          # 7. デモに有料部分が紛れていないか
          #    before/after は無料記事の作例である。暗号文があるのは組み立てを誤ったとき
          if [ -d _site/demo ] && grep -rl 'data-enc=' _site/demo/ >/dev/null 2>&1; then
            echo "::error::demo に暗号化データが含まれています（組み立てを確認）"
            grep -rl 'data-enc=' _site/demo/ || true
            fail=1
          fi

          # 6. 平文とみられる数値データ
          if grep -rlE '"revenue"|"sales"|"followers"' _site/data/ >/dev/null 2>&1; then
            echo "::error::data/ に平文とみられるデータがあります"
            fail=1
          fi

          # 8. PWA が成立しているか。
          #    どれか欠けるとホーム画面に追加できないか、追加しても白い枠になる。
          for f in _site/manifest.webmanifest _site/sw.js \
                   _site/assets/icons/dash-192.png _site/assets/icons/dash-512.png \
                   _site/assets/icons/dash-maskable-512.png \
                   _site/assets/icons/posts-192.png _site/assets/icons/posts-512.png \
                   _site/assets/icons/posts-maskable-512.png; do
            [ -f "$f" ] || { echo "::error::$f がありません（PWA が成立しません）"; fail=1; }
          done
          if [ -d _site/posts ] && [ ! -f _site/posts/manifest.webmanifest ]; then
            echo "::error::_site/posts/manifest.webmanifest がありません"
            fail=1
          fi
          # 置換に失敗すると全端末が同じキャッシュ名を使い続け、更新が届かなくなる
          if grep -q '__BUILD__' _site/sw.js; then
            echo "::error::sw.js のビルド識別子が置換されていません"
            fail=1
          fi
          # manifest が壊れていると黙って無視される。構文だけ見ておく
          for m in _site/manifest.webmanifest _site/posts/manifest.webmanifest; do
            [ -f "$m" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$m" \
              || { echo "::error::$m が JSON として壊れています"; fail=1; }
          done

          if [ "$fail" = "0" ]; then
            {
              echo "## 検査を通過しました"
              echo ""
              echo "配信対象:"
              find _site -type f | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
