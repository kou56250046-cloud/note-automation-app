name: fetch-metrics

# note の公開 API から数値を取得し、暗号化して data/ に置く。
# 公開 API を叩くだけなので Routines の枠を消費しない。
#
# ステップ7で scripts/fetch-public.mjs を実装するまでは no-op で終わる。
# ワークフローを先に置いておくことで、スクリプトができた時点で自動的に動き出す。

on:
  schedule:
    - cron: '30 21 * * *'   # UTC 21:30 = JST 06:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-metrics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: スクリプトの有無を確認
        id: check
        run: |
          if [ -f scripts/fetch-public.mjs ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "scripts/fetch-public.mjs が未実装のためスキップしました（ステップ7で実装）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: 数値を取得する
        if: steps.check.outputs.ready == 'true'
        env:
          NOTE_USERNAME: ${{ vars.NOTE_USERNAME }}
        run: node scripts/fetch-public.mjs

      - name: 暗号化する
        if: steps.check.outputs.ready == 'true' && hashFiles('scripts/encrypt.mjs') != ''
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: node scripts/encrypt.mjs

      - name: 変更があればコミットする
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "変更なし" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "数値を更新 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
